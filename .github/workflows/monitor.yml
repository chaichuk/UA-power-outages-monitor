name: Run power outages monitor

on:
  schedule:
    # Runs every 15 minutes to verify NUC health and take over if NUC is offline
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check NUC Status (Failover Check)
        id: failover_check
        run: node ./scripts/check-failover.js

      - name: Install dependencies & Playwright
        if: steps.failover_check.outputs.should_run == 'true'
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: Run monitoring script
        if: steps.failover_check.outputs.should_run == 'true'
        env:
          # --- КИЇВСЬКА ОБЛАСТЬ ---
          CITY_KYIV: ${{ secrets.CITY_KYIV || secrets.CITY }}
          STREET_KYIV: ${{ secrets.STREET_KYIV || secrets.STREET }}
          HOUSE_KYIV: ${{ secrets.HOUSE_KYIV || secrets.HOUSE }}

          # --- ОДЕСЬКА ОБЛАСТЬ ---
          CITY_ODESA: ${{ secrets.CITY_ODESA }}
          STREET_ODESA: ${{ secrets.STREET_ODESA }}
          HOUSE_ODESA: ${{ secrets.HOUSE_ODESA }}

          # --- ДНІПРОПЕТРОВСЬКА ОБЛАСТЬ ---
          CITY_DNIPRO: ${{ secrets.CITY_DNIPRO }}
          STREET_DNIPRO: ${{ secrets.STREET_DNIPRO }}
          HOUSE_DNIPRO: ${{ secrets.HOUSE_DNIPRO }}

          # --- CLOUDFLARE WORKER ---
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          CF_WORKER_TOKEN: ${{ secrets.CF_WORKER_TOKEN }}
        run: node ./src/monitor.js

      - name: Commit updated data
        if: steps.failover_check.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add dtek.json artifacts/

          if ! git diff --cached --quiet; then
            git commit -m "failover: cloud backup update [skip ci]"
            # Rebase after commit to smoothly incorporate concurrent commits
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes to commit"
          fi
